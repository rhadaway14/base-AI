[project]
name = "app-couchbase-client"
version = "0.1.0"
description = "Couchbase persistence boundary (SDK added with first real repository)"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic-settings>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_couchbase"]
