[project]
name = "app-domain-models"
version = "0.1.0"
description = "Shared application domain contracts"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_domain"]
