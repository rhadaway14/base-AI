[project]
name = "architected-ai-starter"
version = "0.1.0"
description = "Production-shaped starter for AI-enabled applications"
requires-python = ">=3.12,<3.14"
dependencies = [
    "app-domain-models",
    "app-llm-client",
    "app-observability",
    "app-couchbase-client",
    "app-api",
    "agent-gateway",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
exclude = ["apps/web"]

[tool.uv.sources]
app-domain-models = { workspace = true }
app-llm-client = { workspace = true }
app-observability = { workspace = true }
app-couchbase-client = { workspace = true }
app-api = { workspace = true }
agent-gateway = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "S", "BLE", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/domain-models/src",
    "packages/llm-client/src",
    "packages/observability/src",
    "packages/couchbase-client/src",
    "apps/api/src",
    "apps/agent-gateway/src",
]
exclude = ["apps/web/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["couchbase.*", "acouchbase.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires local infrastructure",
    "e2e: requires the full docker compose stack",
]

[tool.coverage.run]
branch = true
source = ["packages", "apps"]
